spring:
  application:
    name: payment
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  profiles:
    active: dev
server:
  port: ${PORT:8080}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000}
logging:
  level:
    root: INFO
    com.application.payment: TRACE

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

encryption:
  aes:
    key: ${AES_SECRET_KEY:3rnRgXb3Fms52dak4NYq1jiUgDmRmrtyKk166sMGUsQ=}

maximum:
  retry:
    times: 3
    duration: 5
