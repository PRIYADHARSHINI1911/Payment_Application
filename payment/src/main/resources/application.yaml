spring:
  application:
    name: payment
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  profiles:
    active: dev
server:
  port: 8080
logging:
  level:
    root: INFO
    com.application.payment: TRACE

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

encryption:
  aes:
    key: ${AES_SECRET_KEY:3rnRgXb3Fms52dak4NYq1jiUgDmRmrtyKk166sMGUsQ=}

maximum:
  retry:
    times: 3
    duration: 30
