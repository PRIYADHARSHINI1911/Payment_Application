openapi: 3.0.3
info:
  title: Payment Application API
  version: 1.0.0
paths:
  /api/payments:
    post:
      tags:
        - payment
      operationId: createPayment
      summary: Create a new payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                type: string
                example: "Payment created successfully"
        '400':
          description: Validation error
        '500':
          description: Internal server error
  /api/webhooks:
    post:
      tags:
        - webhook
      operationId: registerWebhook
      summary: Register a new webhook URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
      responses:
        '201':
          description: Webhook registered
          content:
            application/json:
              schema:
                type: string
                example: "Webhook registered successfully"
        '400':
          description: Validation error
        '500':
          description: Internal server error
components:
  schemas:

    PaymentRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        zip:
          type: string
        cardNumber:
          type: string
        amount:
          type: number
        clientId:
          type: string


    WebhookRequest:
      type: object
      properties:
        url:
          type: string
        clientId:
          type: string
